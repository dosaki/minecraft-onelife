name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -PreleaseVersion="${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="build/libs/onelife-${GITHUB_REF_NAME#v}.jar"
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" "$JAR" \
            --title "$GITHUB_REF_NAME" \
            --notes "sha256: \`$SHA\`"
